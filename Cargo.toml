[package]
name = "ruc"
version = "0.1.0"
edition = "2024"

[dependencies]
vec1 = "1.12.1"
ordered-float = { version = "5.3.0", features = ["serde"] }
indexmap = { version = "2.0", features = ["serde"] }
derive_more = { version = "2.1.0", features = ["unwrap"] }
strum = { version = "0.28.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
